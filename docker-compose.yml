# pkviewer, two containers.
#
# The split mirrors the architecture rather than fighting it: the API is the
# only process that opens SQLite, so there is exactly one writer, and the web
# tier renders and proxies.
#
#   docker compose pull && docker compose up -d
#
# This file only ever RUNS images; it never builds them. Images are built and
# published by .github/workflows/images.yml, so what runs is always something
# CI produced from a known commit, and the server needs no toolchain, no source
# checkout and no spare CPU. To build one by hand:
#
#   docker build -f docker/api.Dockerfile .
#
# Always `latest`: a `docker compose pull` is the whole upgrade, and there is no
# version to keep in step anywhere. Configuration comes from the .env file
# beside this one (or point elsewhere with `--env-file`); nothing secret is
# baked into an image.

services:
  api:
    image: doughmination/pkviewer-api:latest
    # Always: `latest` is a moving tag, so a restart must go and fetch it
    # rather than reuse whatever is in the local image cache.
    pull_policy: always
    restart: unless-stopped
    # NOTE: no `ports:`. The API is internal — the browser never calls it, the
    # web tier proxies everything. Publishing 3001 would put the management API
    # straight onto the host's network, which the architecture forbids. It is
    # reachable only over the compose network, by name.
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/pkviewer.db
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
      PUBLIC_ASSET_ORIGIN: ${PUBLIC_ASSET_ORIGIN:-}
      INTERNAL_API_ORIGIN: http://api:3001
      PK_USER_AGENT_CONTACT: ${PK_USER_AGENT_CONTACT:?set PK_USER_AGENT_CONTACT in .env}
      PK_API_BASE: ${PK_API_BASE:-https://api.pluralkit.me/v2}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URIS: ${DISCORD_REDIRECT_URIS:-}
      BETA_MODE: ${BETA_MODE:-true}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      BETA_ALLOWED_DISCORD_IDS: ${BETA_ALLOWED_DISCORD_IDS:-}
    volumes:
      # The one thing that must survive the container. Everything pkviewer owns
      # lives in this file: accounts, claims, addresses, themes, links.
      - pkviewer-data:/data
    healthcheck:
      # Uses Bun rather than wget or curl: this is a Bun image, so the runtime
      # is certain to be there while a fetch tool is not.
      test:
        - CMD
        - bun
        - -e
        - fetch("http://127.0.0.1:3001/health").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: doughmination/pkviewer-web:latest
    # Always: `latest` is a moving tag, so a restart must go and fetch it
    # rather than reuse whatever is in the local image cache.
    pull_policy: always
    restart: unless-stopped
    # The way in. Published on every interface, not just loopback, because a
    # loopback bind is unreachable from another container or another machine --
    # and the reference deployment has no public IP: Cloudflare Tunnel dials
    # out and forwards here, so nothing is inbound-reachable at the edge.
    #
    # Plain http on that hop is fine. TLS terminates at Cloudflare, and `Secure`
    # is set unconditionally rather than inferred from the request, so no
    # forwarded-proto trust needs configuring.
    #
    # On a host that DOES have a public IP, note that Docker publishes ahead of
    # ufw's chain, so `ufw deny 3000` would not close this.
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
      INTERNAL_API_ORIGIN: http://api:3001
      PUBLIC_DOCS_URL: ${PUBLIC_DOCS_URL:-}
      BETA_MODE: ${BETA_MODE:-true}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pkviewer-data:
