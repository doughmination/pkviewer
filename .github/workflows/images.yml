name: Publish images

# Builds both images and pushes them to Docker Hub, so a server pulls rather
# than compiles. Building on the box costs about seventy seconds of CPU it does
# not have spare, and means the running code was compiled somewhere unversioned.
#
# Images are built for amd64 and arm64: most VPS hosts are amd64, Apple Silicon
# is arm64, and one manifest serves both.
#
# Requires one repository secret, DOCKERHUB_TOKEN: an access token from
# Docker Hub → Account settings → Personal access tokens, with Read & Write
# scope. An access token, never the account password — a token is scoped and can
# be revoked on its own.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # The Docker Hub account. Not a secret: it is half of every published image
  # name, and docker-compose.yml names it too.
  DOCKERHUB_USER: doughmination

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/api.Dockerfile
          - name: web
            dockerfile: docker/web.Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USER }}/pkviewer-${{ matrix.name }}
          tags: |
            # NO `latest` here. The two images build in parallel and finish
            # minutes apart, so pushing `latest` from inside the matrix leaves a
            # window where a deploy pulls a new API beside an old web tier — the
            # symptom is a page that 404s while its API route answers fine.
            # `latest` is moved by the promote job once BOTH have succeeded.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The repository root: both images depend on the shared workspace.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache, so a source-only change does not reinstall dependencies
          # on every run.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Docker Hub renders a plain manifest list more predictably than one
          # carrying provenance attestations.
          provenance: false

      - name: Report what was published
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Both images move to `latest` together, or neither does.
  #
  # `needs: build` waits for every matrix arm, so a failed or slow web build can
  # no longer leave `latest` pointing at a mismatched pair. This retags the
  # already-published manifests rather than rebuilding, so it is a few seconds
  # and cannot produce a different artifact than the one that was tested.
  promote:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Move latest to this commit
        run: |
          set -euo pipefail
          short="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          for image in api web; do
            name="${DOCKERHUB_USER}/pkviewer-${image}"
            echo "::group::${name}"
            # Retag the multi-arch manifest by digest; no rebuild, no re-push.
            docker buildx imagetools create \
              --tag "${name}:latest" "${name}:sha-${short}"
            docker buildx imagetools inspect "${name}:latest" | head -5
            echo "::endgroup::"
          done
          {
            echo "### Promoted to latest"
            echo '```'
            echo "${DOCKERHUB_USER}/pkviewer-api:sha-${short}"
            echo "${DOCKERHUB_USER}/pkviewer-web:sha-${short}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
